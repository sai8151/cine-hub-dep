<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages SPA fallback: remember the requested path, then load the SPA.
      (function () {
        var target = window.location.pathname + window.location.search;
        try {
          sessionStorage.setItem('cinevault_redirect', target);
        } catch (e) {}
        window.location.replace('/');
      })();
    </script>
  </head>
  <body></body>
</html>
